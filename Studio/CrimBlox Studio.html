<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>CrimBlox Studio</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#f0f0f0;--panel:#fff;--line:#c8c8c8;--line2:#dcdcdc;--hdr:#f5f5f5;--txt:#1b1b1b;--dim:#6f6f6f;--sel:#c8dcf4;--selb:#86a9d6;--blue:#2b72c7;--lw:190px;--rw:290px;--bh:150px}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:12px/1.25 "Segoe UI","Source Sans Pro",Tahoma,Arial,sans-serif;overflow:hidden;user-select:none}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:grid;grid-template-rows:22px 24px auto 1fr 24px;height:100%}
#titlebar{display:flex;align-items:center;gap:8px;padding:0 8px;background:#fff;border-bottom:1px solid var(--line2);color:#333}
#titlebar .logo{width:14px;height:14px;background:linear-gradient(135deg,#d33,#a11);color:#fff;font:700 10px/14px Arial;text-align:center;border-radius:2px}
#rtabs{display:flex;align-items:flex-end;background:var(--bg);padding-left:4px;border-bottom:1px solid var(--line)}
#rtabs .rt{padding:3px 11px 4px;font-size:11px;letter-spacing:.03em;color:#444;cursor:pointer;border:1px solid transparent;border-bottom:0;margin-bottom:-1px}
#rtabs .rt.file{color:#fff;background:var(--blue);margin-right:3px;padding:3px 14px}
#rtabs .rt:hover:not(.on):not(.file){background:#e4e4e4}#rtabs .rt.on{background:#fff;border-color:var(--line);color:#000}
#ribbon{background:#fff;border-bottom:1px solid var(--line);height:88px;display:flex;align-items:stretch;padding:2px 4px;overflow:hidden}
.rgroup{display:flex;flex-direction:column;border-right:1px solid var(--line2);padding:0 6px}.rgroup .rb{display:flex;gap:2px;flex:1;align-items:flex-start;padding-top:2px}.rgroup .rl{text-align:center;font-size:10.5px;color:var(--dim);padding:1px 0 2px}
.rbtn{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1px;min-width:40px;padding:3px 4px;border:1px solid transparent;background:none;cursor:pointer;font-size:11px;color:#222;height:58px}
.rbtn svg{width:30px;height:30px}.rbtn:hover:not(:disabled){background:#e9f1fb;border-color:#b9cfe9}.rbtn.on{background:#cfe0f5;border-color:var(--selb)}.rbtn:disabled{opacity:.4;cursor:default}
.rbtn.small{height:26px;flex-direction:row;gap:5px;padding:2px 6px;min-width:0}.rbtn.small svg{width:18px;height:18px}
.rstack{display:flex;flex-direction:column;gap:0}.rfield{display:flex;align-items:center;gap:4px;font-size:11px;padding:1px 4px}.rfield input[type=number]{width:46px;height:20px;border:1px solid var(--line);padding:0 3px}
#work{display:grid;grid-template-columns:var(--lw) 1fr var(--rw);min-height:0;background:var(--bg)}
.panel{background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.phead{display:flex;align-items:center;justify-content:space-between;background:var(--hdr);border-bottom:1px solid var(--line2);padding:2px 6px;font-weight:600;font-size:11.5px;color:#333;flex:none}
.phead .x{cursor:pointer;color:#777;padding:0 3px}.phead .x:hover{color:#c00}
.psearch{border:0;border-bottom:1px solid var(--line2);padding:3px 6px;font-size:11.5px;outline:none;flex:none}
#left{grid-column:1}#center{grid-column:2;display:flex;flex-direction:column;min-height:0;min-width:0;padding:0 2px}#right{grid-column:3;display:flex;flex-direction:column;min-height:0}
#right #explorer{flex:1 1 55%}#right #properties{flex:1 1 45%}
#doctabs{display:flex;align-items:flex-end;height:22px;flex:none;background:var(--bg);border-bottom:1px solid var(--line)}
.dt{display:flex;align-items:center;gap:6px;padding:2px 8px;border:1px solid var(--line);border-bottom:0;background:#e6e6e6;margin-right:2px;cursor:pointer;max-width:180px;white-space:nowrap}.dt.on{background:#fff}.dt .c{color:#c33;font-weight:700;padding:0 2px}.dt .c:hover{background:#fdd}.dt .dirty{color:#2b72c7}
#viewport{position:relative;flex:1;min-height:0;background:#6a8fb5;overflow:hidden;border:1px solid var(--line)}
#viewport canvas{position:absolute;inset:0;width:100%;height:100%;display:block}#overlay{pointer-events:none}
#guilayer,#uicanvas{position:absolute;inset:0}#guilayer{pointer-events:none;overflow:hidden}#uicanvas{display:none;background:rgba(18,22,30,.55)}#uicanvas.on{display:block}
#vpmsg{position:absolute;left:50%;top:40%;transform:translateX(-50%);background:rgba(255,255,255,.92);border:1px solid var(--line);padding:10px 14px;display:none;max-width:420px;color:#a00}
#editor{position:absolute;inset:0;background:#fff;display:none}#editor.on{display:flex;flex-direction:column}
#bottom{height:var(--bh);flex:none;margin-top:2px}
.tabs{display:flex;background:var(--hdr);border-bottom:1px solid var(--line2);flex:none}.tabs .t{padding:3px 10px;cursor:pointer;font-weight:600;font-size:11.5px;color:#555}.tabs .t.on{color:#000;background:#fff;border-bottom:2px solid var(--blue)}
.list{flex:1;overflow:auto;min-height:0}
.obj{display:flex;align-items:center;gap:6px;padding:1px 6px;height:18px;cursor:default;white-space:nowrap}.obj:hover{background:#eef4fb}
.ico{width:14px;height:14px;flex:none;border-radius:2px;position:relative}
#exscroll{flex:1;overflow:auto;position:relative;min-height:0}#exrows{position:absolute;left:0;right:0;top:0}
.xrow{position:absolute;left:0;right:0;height:18px;display:flex;align-items:center;white-space:nowrap;cursor:default;border:1px solid transparent}.xrow:hover{background:#eef4fb}.xrow.sel{background:var(--sel);border-color:var(--selb)}.xrow.dropt{outline:1px dashed #2b72c7}
.arrow{width:14px;text-align:center;color:#666;font-size:9px;flex:none;cursor:pointer}
#pbody{flex:1;overflow:auto;min-height:0}.cat{background:#efefef;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);font-weight:600;padding:2px 6px;cursor:pointer;font-size:11.5px}
.prow{display:grid;grid-template-columns:42% 58%;border-bottom:1px solid #ececec;min-height:20px;align-items:center}.prow .pn{padding:0 6px;color:#333;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-right:1px solid #ececec;height:100%;display:flex;align-items:center}.prow .pn .arrow{margin-left:-4px}.prow .pv{padding:0 3px;display:flex;align-items:center;gap:4px;min-width:0}
.prow.sub .pn{padding-left:20px;color:#666}.pv input[type=text],.pv input[type=number],.pv select{width:100%;border:1px solid transparent;background:transparent;padding:1px 2px;height:18px;outline:none}.pv input:focus,.pv select:focus{border-color:#4c8ad6;background:#fff}.pv input.bad{background:#fde0e0;border-color:#d44}.pv .ro{color:#666;padding:1px 2px}
.pv input[type=color]{width:20px;height:16px;padding:0;border:1px solid #999;flex:none}.pv input[type=checkbox]{margin:0 2px}
#out{flex:1;overflow:auto;font:11.5px/1.3 Consolas,"Courier New",monospace;padding:3px 6px;user-select:text}.ol{white-space:pre-wrap}.ol.info{color:#1558b0}.ol.warn{color:#b06a00}.ol.error{color:#c00000}
#cmdbar{display:flex;align-items:center;gap:6px;background:#fff;border-top:1px solid var(--line);padding:0 6px}#cmdbar input{flex:1;border:1px solid var(--line);height:18px;padding:0 4px;font:11.5px Consolas,monospace;outline:none}#cmdbar .st{color:var(--dim);min-width:160px;text-align:right}
.menu{position:fixed;background:#fff;border:1px solid #999;box-shadow:2px 3px 6px rgba(0,0,0,.25);z-index:50;min-width:170px;padding:2px 0}.menu .mi{padding:3px 24px 3px 20px;cursor:pointer;white-space:nowrap}.menu .mi:hover{background:var(--sel)}.menu .mi.dis{color:#aaa;pointer-events:none}.menu hr{border:0;border-top:1px solid #ddd;margin:2px 0}
.floating{position:absolute;background:#fff;border:1px solid #888;box-shadow:2px 3px 8px rgba(0,0,0,.3);z-index:20}
#terrpanel{left:8px;top:8px;width:170px;display:none}#terrpanel.on{display:block}#terrpanel .tp{padding:6px 8px;display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center}#terrpanel input[type=range]{width:100%}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:6px 8px}.swatches div{height:22px;border:2px solid transparent;cursor:pointer}.swatches div.on{border-color:#2b72c7}
.gui{position:absolute;box-sizing:border-box;overflow:hidden}.gui.btn{cursor:pointer}
.hdl{position:absolute;width:9px;height:9px;background:#fff;border:1px solid #2b72c7;margin:-5px 0 0 -5px}
.codewrap{position:relative;flex:1;min-height:0;display:flex;background:#fff;font:12.5px/1.45 Consolas,"Courier New",monospace}.gut{width:44px;background:#f3f3f3;color:#999;text-align:right;padding:4px 6px 4px 0;overflow:hidden;white-space:pre;border-right:1px solid #ddd}.gut .e{color:#d33}.gut .w{color:#d90}
.cscroll{position:relative;flex:1;overflow:auto}.cscroll pre,.cscroll textarea{margin:0;padding:4px 8px;font:inherit;white-space:pre;tab-size:2;border:0;left:0;top:0;min-width:100%;min-height:100%}.cscroll pre{position:relative;pointer-events:none}.cscroll textarea{position:absolute}.cscroll textarea{background:transparent;color:transparent;caret-color:#000;resize:none;outline:none;overflow:hidden;width:100%;height:100%}
.k{color:#0033b3;font-weight:600}.s{color:#0a7a1e}.n{color:#a05a00}.c{color:#8a8a8a;font-style:italic}.g{color:#7a3e9d}
.ac{position:absolute;background:#fff;border:1px solid #999;box-shadow:2px 3px 6px rgba(0,0,0,.25);z-index:5;max-height:180px;overflow:auto;min-width:200px}.ac div{padding:1px 8px;display:flex;gap:10px;justify-content:space-between;cursor:pointer}.ac div.on{background:var(--sel)}.ac small{color:#888}
.probs{height:62px;overflow:auto;border-top:1px solid #ddd;background:#fafafa;font-size:11.5px;padding:2px 6px;flex:none}.probs div{cursor:pointer}.probs .e{color:#c00}.probs .w{color:#a86a00}.probs .h{color:#777}
.drop{border:2px dashed #9ab;margin:6px;padding:8px;text-align:center;color:#678;cursor:pointer;flex:none}.drop.hot{background:#e6f1ff;border-color:#2b72c7}
.arow{display:flex;align-items:center;gap:8px;padding:2px 6px;border-bottom:1px solid #eee}.arow img,.arow .th{width:28px;height:28px;object-fit:cover;background:#ddd;flex:none;text-align:center;line-height:28px}.arow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.arow .su{font-size:10.5px;color:#777}.arow .ok{color:#2a8a2a}.arow .bad{color:#c00}
</style></head><body>
<div id="app">
  <div id="titlebar"><div class="logo">C</div><span>CrimBlox Studio - <span id="placename">Place1</span></span><span style="flex:1"></span><span id="modechip" style="color:#777"></span></div>
  <div id="rtabs"></div><div id="ribbon"></div>
  <div id="work">
    <div id="left" class="panel"></div>
    <div id="center"><div id="doctabs"></div>
      <div id="viewport"><canvas id="c"></canvas><canvas id="overlay"></canvas><div id="guilayer"></div><div id="uicanvas"></div><div id="terrpanel" class="floating"></div><div id="vpmsg"></div><div id="editor"></div></div>
      <div id="bottom" class="panel"></div></div>
    <div id="right"><div id="explorer" class="panel"></div><div id="properties" class="panel"></div></div>
  </div>
  <div id="cmdbar"><input id="cmd" placeholder="Run a command" spellcheck="false"><span class="st" id="status"></span></div>
</div>
<input id="filepick" type="file" multiple style="display:none">
<script type="module">
const __WORKER_SRC__ = "// Minimal column-major math (right-handed, WebGPU depth 0..1).\nconst sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];\nconst dot = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];\nconst cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];\nconst norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; };\n\nfunction mul(a, b) {\n  const o = new Float32Array(16);\n  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {\n    let s = 0; for (let k = 0; k < 4; k++) s += a[k*4+r] * b[c*4+k];\n    o[c*4+r] = s;\n  }\n  return o;\n}\nfunction perspective(fovY, aspect, n, f) {\n  const t = 1 / Math.tan(fovY / 2), m = new Float32Array(16);\n  m[0] = t / aspect; m[5] = t; m[10] = f / (n - f); m[11] = -1; m[14] = f * n / (n - f);\n  return m;\n}\n// View z in [-near, -far] maps to depth [0, 1].\nfunction ortho(l, r, b, t, n, f) {\n  const m = new Float32Array(16);\n  m[0] = 2/(r-l); m[5] = 2/(t-b); m[10] = 1/(n-f);\n  m[12] = -(r+l)/(r-l); m[13] = -(t+b)/(t-b); m[14] = n/(n-f); m[15] = 1;\n  return m;\n}\nfunction lookAt(eye, target, up) {\n  const f = norm(sub(target, eye)), s = norm(cross(f, up)), u = cross(s, f);\n  return new Float32Array([s[0],u[0],-f[0],0, s[1],u[1],-f[1],0, s[2],u[2],-f[2],0,\n    -dot(s,eye), -dot(u,eye), dot(f,eye), 1]);\n}\nconst xform = (m, p) => [\n  m[0]*p[0]+m[4]*p[1]+m[8]*p[2]+m[12],\n  m[1]*p[0]+m[5]*p[1]+m[9]*p[2]+m[13],\n  m[2]*p[0]+m[6]*p[1]+m[10]*p[2]+m[14]];\n// T * Ry(yaw) * S\nfunction modelMatrix(p, s, yaw) {\n  const c = Math.cos(yaw), n = Math.sin(yaw);\n  return new Float32Array([c*s[0],0,-n*s[0],0, 0,s[1],0,0, n*s[2],0,c*s[2],0, p[0],p[1],p[2],1]);\n}\n\n// ---- vectors and quaternions ([x, y, z, w]); Euler order is Y, then X, then Z (angles in radians) ----\nconst add = (a, b) => [a[0]+b[0], a[1]+b[1], a[2]+b[2]];\nconst scale = (a, s) => [a[0]*s, a[1]*s, a[2]*s];\nconst len = a => Math.hypot(a[0], a[1], a[2]);\nconst qmul = (a, b) => [a[3     try { const r = new BinReader(packet); r.u8(); this.applier.apply(r); } catch (e) { this.post({ t: 'out', text: 'bridge error: ' + e.message }); } finally { this.rep.muted = false; }
  }
}

// Main-thread side of the script bridge. Owns the real (server) data model, runs the script thread in a Web Worker,
// feeds it every change, applies its validated changes back, forwards host events (Touched, OnServerEvent ...), keeps the
// frame clock (Stepped before physics, Heartbeat after), and restarts the worker if it stops answering.


const FORWARDED = new Set(['Touched', 'TouchEnded', 'OnServerEvent', 'OnClientEvent', 'PlayerAdded', 'PlayerRemoving', 'Activated']);
const now = () => (typeof performance !== 'undefined' ? performance.now() : Date.now());

class ScriptHost {
  // workerSource: JS text of the worker bundle. createChannel(onMessage, onFail) -> {post, terminate}: custom transport (used by tests).
  constructor(game, { print = console.log, workerSource = null, createChannel = null, watchdogMs = 3000, startTimeoutMs = 3000, stepLimit = 2e6 } = {}) {
    this.game = game; this.print = print; this.opts = { workerSource, createChannel, watchdogMs, startTimeoutMs, stepLimit };
    this.mode = 'starting'; this.onRestart = null; this.time = 0; this.stats = { opsApplied: 0, restarts: 0, events: 0 }; this.invokes = new Map(); this.invSeq = 0; game.scriptHost = this;
    this._start(workerSource || createChannel ? 'worker' : 'inline');
  }
  _channel(kind) {
    const onMsg = m => this._onMsg(m), o = this.opts;
    if (kind === 'worker' && o.createChannel) return o.createChannel(onMsg, err => this._workerFailed(err));
    if (kind === 'worker' && typeof Worker !== 'undefined' && o.workerSource) {
      const url = URL.createObjectURL(new Blob([o.workerSource], { type: 'text/javascript' })), w = new Worker(url);
      w.onmessage = e => onMsg(e.data); w.onerror = ev => this._workerFailed(ev.message || 'worker error');
      return { post: (m, tr) => w.postMessage(m, tr), terminate: () => { w.terminate(); URL.revokeObjectURL(url); } };
    }
    const core = new ScriptWorkerCore(m => queueMicrotask(() => onMsg(m))); this.core = core;       // same code, this thread
    return { post: m => queueMicrotask(() => core.onmessage(m)), terminate: () => {} };
  }
  _start(kind) {
    if (this.feed) this.feed.muted = true;                                                        // retire the old feed on restart
    for (const c of this.conns ?? []) c.Disconnect();
    this.conns = []; this.hooked = new WeakMap(); this.ready = false; this.pings = 0; this.pongs = 0; this.lastPong = now();
    try { this.chan = this._channel(kind); } catch (e) { this.print('script worker unavailable (' + e.message + '); running scripts on the main thread'); kind = 'inline'; this.chan = this._channel('inline'); }
    this.kind = kind; this.mode = kind === 'inline' ? 'main thread' : 'worker thread (starting)';
    this.chan.post({ t: 'init', snapshot: encodeWorldSnapshot(this.game), stepLimit: this.opts.stepLimit });
    this.feed = new Replicator(this.game, { all: true }); this.applier = new DeltaApplier(this.game, { remoteIds: false });   // created right after the snapshot: no gap
    clearTimeout(this.startTimer);
    if (kind === 'worker') this.startTimer = setTimeout(() => { if (!this.ready) this._workerFailed('worker did not start (blocked by the page?)'); }, this.opts.startTimeoutMs);
  }
  _workerFailed(reason) { if (this.kind === 'inline') return; this.print(`script worker failed: ${reason}; falling back to the main thread`); this.chan.terminate(); this._start('inline'); this.stats.restarts++; this.onRestart?.(reason); }
  _restart(reason) { this.print(`script worker unresponsive (${reason}); restarting it`); this.chan.terminate(); this._start('worker'); this.stats.restarts++; this.onRestart?.(reason); }
  dispose() { clearTimeout(this.startTimer); this.chan.terminate(); this.feed.muted = true; for (const c of this.conns) c.Disconnect(); }

  _onMsg(m) {
    switch (m.t) {
      case 'ready': this.ready = true; clearTimeout(this.startTimer); if (this.kind === 'worker') this.mode = 'worker thread'; break;
      case 'out': this.print(m.text); break;
      case 'pong': this.pongs = m.n; this.lastPong = now(); break;
      case 'ops': this._applyOps(m.packet); break;
      case 'listen': this._listen(m); break;
      case 'call': this._call(m); break;
      case 'rpc': this._rpc(m); break;
      case 'rfreply': { const reply = this.invokes.get(m.k); this.invokes.delete(m.k); reply?.(m.ok, m.ok ? m.values.map(v => decVal(v, id => this.applier.lookup(id))) : m.error); break; }
    }
  }
  // Script-made changes arrive as a delta. They are validated by DeltaApplier (no services, no abstract classes, op cap), applied to the real
  // tree, and the real ids go back to the worker so its temporary ids can be replaced.
  _applyOps(packet) {
    this.feed.muted = true;
    try { const r = new BinReader(packet); r.u8(); const map = this.applier.apply(r); if (map.length) this.chan.post({ t: 'idmap', map }); this.stats.opsApplied++; }
    catch (e) { this.print('script bridge rejected a packet: ' + e.message); }
    finally { this.feed.muted = false; }
  }
  _listen(m) {
    const inst = this.applier.lookup(m.id); if (!inst || !FORWARDED.has(m.name)) return;
    const seen = this.hooked.get(inst) ?? new Set(); if (seen.has(m.name)) return; seen.add(m.name); this.hooked.set(inst, seen);
    this.conns.push(inst._sig(m.name).Connect((...args) => { this.flushFeed(); this.stats.events++; this.chan.post({ t: 'evt', id: inst._id, name: m.name, args: args.map(encVal) }); }));
  }
  _call(m) {
    const inst = this.applier.lookup(m.id), lookup = id => this.applier.lookup(id), args = (m.args ?? []).map(a => decVal(a, lookup));
    if (!inst) return;
    if (m.method === 'ApplyImpulse' && inst.IsA('BasePart') && args[0]) this.game.physics?.applyImpulse(inst, args[0]);
    else if ((m.method === 'FireClient' || m.method === 'FireAllClients') && inst.ClassName === 'RemoteEvent') this.game.net?.fireRemote(inst, m.method === 'FireAllClients' ? 'all' : 'client', args, lookup(m.target));
    else if (m.method === 'FireServer' && inst.ClassName === 'RemoteEvent') this.game.net?.fireRemote(inst, 'server', args);                                  // client script -> server
  }

  // A script called RemoteFunction:InvokeServer / InvokeClient: send it over the network layer and resume the thread when the reply comes back.
  _rpc(m) {
    const inst = this.applier.lookup(m.id), lookup = id => this.applier.lookup(id), net = this.game.net;
    const done = (ok, v) => this.chan.post({ t: 'rpcdone', cid: m.cid, ok, values: ok ? v.map(encVal) : [], error: ok ? '' : String(v) });
    if (m.dir === 'content') {                                                                  // ContentProvider:PreloadAsync(list)
      const cp = this.game.contentProvider; if (!cp) return done(true, []);                    // no asset manager here (e.g. the server): nothing to load
      const urls = (m.args[0]?.$ === 4 ? m.args[0].a : []).filter(u => typeof u === 'string').slice(0, 256);
      cp.preload(urls).then(() => done(true, []), e => done(false, e.message)); return;
    }
    if (!inst || inst.ClassName !== 'RemoteFunction' || !net?.rpc) return done(false, 'RemoteFunction is not available here');
    net.rpc(inst, m.dir, m.args.map(a => decVal(a, lookup)), m.target ? lookup(m.target) : null, done);
  }
  // A request from the other side of the network: hand it to the script thread's OnServerInvoke / OnClientInvoke callback.
  invoke(inst, name, args, reply) {
    const k = ++this.invSeq; this.invokes.set(k, reply); this.flushFeed();
    this.chan.post({ t: 'invoke', k, id: inst._id, name, args: args.map(encVal) });
  }

  // ---- frame clock
  flushFeed() { const pkt = this.feed.flush(); if (pkt) this.chan.post({ t: 'feed', packet: pkt }, [pkt.buffer]); }
  run(source) { this.flushFeed(); this.chan.post({ t: 'run', source }); }
  stepped(dt) { this.flushFeed(); this.time += dt; this.chan.post({ t: 'stepped', dt, time: this.time }); }
  heartbeat(dt) {
    this.flushFeed(); this.chan.post({ t: 'heartbeat', dt }); this.chan.post({ t: 'ping', n: ++this.pings });
    if (this.kind === 'worker' && this.ready && this.pings - this.pongs > 1 && now() - this.lastPong > this.opts.watchdogMs) this._restart(`no reply for ${this.opts.watchdogMs} ms`);
  }
}

// Keeps the GPU instance buffer in step with a DataModel: parts appear, move, recolor, turn transparent and disappear by listening
// to change signals. Only parts whose properties changed are rewritten each frame.
//   Transparency 0          -> solid region (casts shadows)
//   0 < Transparency < 0.98 -> glass region (alpha-blended, no shadow)
//   Transparency >= 0.98    -> hidden (no GPU slot at all)

const SHAPE = { Block: 'cube', Ball: 'sphere', Cylinder: 'cylinder', Wedge: 'wedge', Cone: 'cone' };
const SS_DEG = Math.PI / 180;
const groupOf = p => { const t = p.Transparency; return t >= 0.98 ? { hidden: true } : { hidden: false, shape: SHAPE[p.Shape] ?? 'cube', glass: t > 0.001 }; };

class SceneSync {
  // interp + clock (optional): parts in the physics stream are drawn at an interpolated pose, a little in the past, never snapped to a packet.
  // streamer (optional): MeshParts with a MeshId are drawn through it (placeholder box -> streamed mesh, with LOD and unloading).
  constructor(game, renderer, { interp = null, clock = null, streamer = null } = {}) {
    this.game = game; this.r = renderer; this.interp = interp; this.clock = clock; this.streamer = streamer; this.slots = new Map(); this.hidden = new Set(); this.bySlot = new Map(); this.dirty = new Set(); this.data = new Float32Array(24);
    const ws = game.Workspace; this.conns = []; const on = (sig, fn) => this.conns.push(sig.Connect(fn));
    const drawable = i => i.IsA('Part') || i.ClassName === 'MeshPart';
    on(game.InstanceAdded, i => { if (!i.IsDescendantOf(ws)) return; if (drawable(i)) this._add(i); if (this.streamer && i.IsA('BasePart')) this.streamer.trackOccluder(i); });
    on(game.InstanceRemoving, i => { this.streamer?.untrackOccluder(i); if (this.slots.has(i) || this.hidden.has(i)) this._drop(i); });
    on(game.InstanceReparented, i => { if (drawable(i)) { const known = this.slots.has(i) || this.hidden.has(i); if (i.IsDescendantOf(ws)) { if (!known) this._add(i); } else if (known) this._drop(i); } });
    on(game.PropertyChanged, (i, name) => {
      if (this.streamer) { if (this.streamer.isTracked(i)) this.streamer.refresh(i, name); else if (i.IsA('BasePart') && (name === 'Size' || name === 'Position' || name === 'Anchored' || name === 'Transparency' || name === 'Orientation')) this.streamer.trackOccluder(i); }
      const e = this.slots.get(i), isHidden = this.hidden.has(i); if (!e && !isHidden) return;
      if (name === 'Shape' || name === 'Transparency') {
        const g = groupOf(i);
        if (g.hidden !== isHidden || (e && (g.shape !== e.shape || g.glass !== e.glass))) { this._remove(i); this._add(i); return; }   // moved to another region
      }
      if (e) this.dirty.add(i);
    });
    for (const d of ws.GetDescendants()) { if (drawable(d)) this._add(d); if (this.streamer && d.IsA('BasePart')) this.streamer.trackOccluder(d); }
  }
  _add(part) { if (this.streamer && part.ClassName === 'MeshPart' && part.MeshId) this.streamer.track(part); this._place(part); }
  _drop(part) { this._remove(part); this.streamer?.untrack(part); }
  _place(part) {
    if (this.streamer && part.ClassName === 'MeshPart' && part.MeshId && this.streamer.isTracked(part)) {
      const st = this.streamer.stateOf(part);
      if (st.kind === 'none') { this.hidden.add(part); return; }
      if (st.kind === 'mesh') { const slot = this.r.allocMeshSlot(st.handle); this.slots.set(part, { kind: 'mesh', slot, handle: st.handle, layer: st.layer }); this.bySlot.set(slot, part); this.dirty.add(part); return; }
      const slot = this.r.allocSlot('cube', true); this.slots.set(part, { kind: 'prim', shape: 'cube', slot, glass: true, placeholder: true, failed: st.failed }); this.bySlot.set(slot, part); this.dirty.add(part); return;   // translucent bounding box while loading
    }
    const g = groupOf(part); if (g.hidden) { this.hidden.add(part); return; }
    const slot = this.r.allocSlot(g.shape, g.glass); this.slots.set(part, { shape: g.shape, slot, glass: g.glass }); this.bySlot.set(slot, part); this.dirty.add(part);
  }
  _remove(part) {
    if (this.hidden.delete(part)) return;
    const ent = this.slots.get(part), { shape, slot, glass } = ent; this.slots.delete(part); this.dirty.delete(part); this.bySlot.delete(slot);
    const moved = ent.kind === 'mesh' ? this.r.freeMeshSlot(slot) : this.r.freeSlot(shape, slot, glass);
    if (moved !== null) { const mp = this.bySlot.get(moved); this.bySlot.delete(moved); this.bySlot.set(slot, mp); this.slots.get(mp).slot = slot; }
  }
  renderTime() { const sn = this.clock?.serverNow(performance.now()); return sn == null || !this.interp ? null : sn - this.interp.delay; }
  poseOf(part) { const rt = this.renderTime(), smp = rt === null ? null : this.interp.sample(part._id, rt); return smp ? smp.pos : part.Position.toArray(); }   // what is on screen right now
  flush(camPos = null) {
    if (this.streamer && camPos) { this.streamer.update(camPos); for (const part of this.streamer.takeChanged()) if (this.slots.has(part) || this.hidden.has(part)) { this._remove(part); this._place(part); } }
    const rt = this.renderTime(), next = new Set();
    for (const part of this.dirty) {
      const e = this.slots.get(part); if (!e) continue; const o = part.Orientation, p = part.Position, s = part.Size, c = part.Color, d = this.data;
      const smp = rt === null ? null : this.interp.sample(part._id, rt); let pos = [p.x, p.y, p.z], q;
      if (smp) { pos = smp.pos; q = smp.q; if (!smp.settled) next.add(part); } else q = qFromEulerYXZ(o.x * SS_DEG, o.y * SS_DEG, o.z * SS_DEG);   // keep re-sampling until it catches up
      d.set(modelMatrixQ(pos, [s.x, s.y, s.z], q), 0);
      d[16] = c.r; d[17] = c.g; d[18] = c.b; d[19] = 1 - part.Transparency; d[20] = part.Roughness; d[21] = part.Metalness; d[22] = part.Emissive; d[23] = part.Studs ? 1 : 0;
      if (e.placeholder) { d[16] = e.failed ? 0.9 : 0.62; d[17] = e.failed ? 0.25 : 0.7; d[18] = e.failed ? 0.25 : 0.8; d[19] = 0.35; d[22] = 0; d[23] = 0; }      // grey (red if the asset failed) translucent box
      else if (e.kind === 'mesh') d[23] = 2 * (e.layer + 1);                                                                                           // texture layer + 1, shifted past the studs bit
      this.r.writeSlot(e.slot, d);
    }
    this.dirty = next;
  }
  dispose() { for (const c of this.conns) c.Disconnect(); for (const p of [...this.slots.keys(), ...this.hidden]) this._drop(p); this.streamer?.dispose(); }
  get partCount() { return this.slots.size + this.hidden.size; }
}

// WGSL sources for the FigureBlox-style look: HDR PBR, 3 sun cascades with PCF, procedural or six-face skybox, haze, soft bloom.
const SCENE = /* wgsl */`
const PI = 3.14159265;
const SKY_AMB = vec3f(0.40, 0.60, 0.95);
const GND_AMB = vec3f(0.30, 0.27, 0.22);
struct Frame {
  viewProj: mat4x4f,
  cascadeVP: array<mat4x4f, 3>,
  splits: vec4f,
  camPos: vec4f, camRight: vec4f, camUp: vec4f, camFwd: vec4f,
  proj: vec4f,            // tanHalfFov, aspect, time, 1/shadowSize
  sunDir: vec4f,          // unit vector toward the sun
  sunColor: vec4f,        // linear HDR radiance
  haze: vec4f,            // x = haze density, y = skybox mode (0 procedural, 1 custom six-face texture)
}
struct Inst { model: mat4x4f, color: vec4f, params: vec4f } // params: roughness, metalness, emissive, studs flag
@group(0) @binding(0) var<uniform> F: Frame;
@group(0) @binding(1) var<storage, read> inst: array<Inst>;
@group(0) @binding(2) var shadowTex: texture_depth_2d_array;
@group(0) @binding(3) var shadowSamp: sampler_comparison;
@group(0) @binding(4) var skyTex: texture_2d_array<f32>;   // layers: back, down, front, left, right, top
@group(0) @binding(5) var skySamp: sampler;
@group(0) @binding(6) var meshTex: texture_2d_array<f32>;   // streamed textures, one layer each (sRGB, mipmapped)
@group(0) @binding(7) var meshSamp: sampler;

// ---------------- sky ----------------
fn hash2(p: vec2u) -> f32 {
  var h = p.x * 374761393u + p.y * 668265263u;
  h = (h ^ (h >> 13u)) * 1274126177u;
  return f32(h ^ (h >> 16u)) / 4294967295.0;
}
fn vnoise(p: vec2f) -> f32 {
  let i = floor(p);
  let f = fract(p);
  let u = f * f * (3.0 - 2.0 * f);
  let ip = vec2i(i);
  let a = hash2(bitcast<vec2u>(ip));
  let b = hash2(bitcast<vec2u>(ip + vec2i(1, 0)));
  let c = hash2(bitcast<vec2u>(ip + vec2i(0, 1)));
  let d = hash2(bitcast<vec2u>(ip + vec2i(1, 1)));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
fn fbm(p: vec2f) -> f32 {
  var a = 0.5;
  var s = 0.0;
  var q = p;
  for (var i = 0; i < 5; i++) { s += a * vnoise(q); q = q * 2.03 + vec2f(17.0, 9.0); a *= 0.5; }
  return s / 0.96875;
}

// Soft blue gradient with a bright, hazy horizon band (also used for ambient, reflections and distance haze).
fn skyGradient(d: vec3f) -> vec3f {
  let e = d.y;
  let zen = pow(vec3f(0.36, 0.58, 0.86), vec3f(2.2));
  let mid = pow(vec3f(0.45, 0.72, 0.93), vec3f(2.2));
  let hor = pow(vec3f(0.80, 0.91, 0.95), vec3f(2.2));
  let low = pow(vec3f(0.50, 0.80, 0.94), vec3f(2.2));
  var c = mix(hor, mid, smoothstep(0.0, 0.18, e));
  c = mix(c, zen, smoothstep(0.1, 0.9, e));
  return mix(c, low, smoothstep(0.0, 0.5, -e));
}
// Procedural sky: gradient + wispy streaks near the horizon, puffs overhead, soft sun.
fn skyProc(d: vec3f) -> vec3f {
  var c = skyGradient(d);
  let up = max(d.y, 0.0);
  let p = d.xz / (up + 0.18);
  let n = fbm(p * vec2f(0.55, 1.4) + vec2f(3.0, 7.0));
  let cov = smoothstep(0.50, 0.78, n) * smoothstep(0.0, 0.12, d.y);
  let lit = clamp(0.55 + 0.45 * dot(normalize(vec3f(d.x, up + 0.3, d.z)), F.sunDir.xyz), 0.0, 1.0);
  let cloud = mix(pow(vec3f(0.72, 0.80, 0.88), vec3f(2.2)), pow(vec3f(0.97, 0.98, 0.98), vec3f(2.2)), lit);
  c = mix(c, cloud, cov * 0.9);
  let s = max(dot(d, F.sunDir.xyz), 0.0);
  return c + F.sunColor.rgb * (pow(s, 900.0) * 0.8 + pow(s, 12.0) * 0.03);
}
// Six-face skybox lookup. Faces follow the sheet order: back, down, front, left, right, top.
// Front is -Z (the way the camera looks at yaw 0), right is +X, up is +Y.
fn skyTexColor(d: vec3f) -> vec3f {
  let a = abs(d);
  var layer = 0;
  var uv = vec2f(0.0);
  if (a.z >= a.x && a.z >= a.y) {
    if (d.z < 0.0) { layer = 2; uv = vec2f(d.x / a.z, -d.y / a.z); }
    else { layer = 0; uv = vec2f(-d.x / a.z, -d.y / a.z); }
  } else if (a.x >= a.y) {
    if (d.x > 0.0) { layer = 4; uv = vec2f(d.z / a.x, -d.y / a.x); }
    else { layer = 3; uv = vec2f(-d.z / a.x, -d.y / a.x); }
  } else {
    if (d.y > 0.0) { layer = 5; uv = vec2f(d.x / a.y, -d.z / a.y); }
    else { layer = 1; uv = vec2f(d.x / a.y, d.z / a.y); }
  }
  let t = clamp(uv * 0.5 + 0.5, vec2f(0.001), vec2f(0.999));
  return textureSampleLevel(skyTex, skySamp, t, layer, 0.0).rgb;
}
fn skyBg(d: vec3f) -> vec3f {
  if (F.haze.y > 0.5) { return skyTexColor(d); }
  return skyProc(d);
}
fn skyEnv(d: vec3f) -> vec3f {
  if (F.haze.y > 0.5) { return skyTexColor(d); }
  return skyGradient(d);
}

// ---------------- geometry ----------------
struct VOut {
  @builtin(position) pos: vec4f,
  @location(0) wpos: vec3f, @location(1) nrm: vec3f,
  @location(2) color: vec4f, @location(3) @interpolate(flat) params: vec4f,
  @location(4) uv: vec2f,
}
@vertex fn vs_main(@location(0) p: vec3f, @location(1) n: vec3f, @location(2) uv: vec2f, @builtin(instance_index) ii: u32) -> VOut {
  let I = inst[ii];
  let w = I.model * vec4f(p, 1.0);
  let a = I.model[0].xyz; let b = I.model[1].xyz; let c = I.model[2].xyz;
  var o: VOut;
  o.uv = uv;
  o.pos = F.viewProj * w;
  o.wpos = w.xyz;
  o.nrm = normalize(cross(b, c) * n.x + cross(c, a) * n.y + cross(a, b) * n.z); // cofactor = inverse-transpose
  o.color = I.color; o.params = I.params;
  return o;
}

// Sun: 3 cascaded shadow maps, 3x3 PCF.
fn shadow(wp: vec3f, n: vec3f) -> f32 {
  let d = dot(wp - F.camPos.xyz, F.camFwd.xyz);
  var idx = 2;
  if (d < F.splits.x) { idx = 0; } else if (d < F.splits.y) { idx = 1; }
  let lp = F.cascadeVP[idx] * vec4f(wp + n * (0.03 + 0.04 * f32(idx)), 1.0);
  let uv = vec2f(lp.x * 0.5 + 0.5, 0.5 - lp.y * 0.5);
  var s = 0.0;
  for (var y = -1; y <= 1; y++) {
    for (var x = -1; x <= 1; x++) {
      s += textureSampleCompareLevel(shadowTex, shadowSamp, uv + vec2f(f32(x), f32(y)) * F.proj.w, idx, lp.z);
    }
  }
  let inside = select(0.0, 1.0, uv.x > 0.0 && uv.x < 1.0 && uv.y > 0.0 && uv.y < 1.0 && lp.z < 1.0);
  return mix(1.0, s / 9.0, inside);
}

fn dGGX(nh: f32, a: f32) -> f32 { let a2 = a * a; let d = nh * nh * (a2 - 1.0) + 1.0; return a2 / (PI * d * d); }
fn gSmith(nv: f32, nl: f32, r: f32) -> f32 {
  let k = (r + 1.0) * (r + 1.0) / 8.0;
  return (nv / (nv * (1.0 - k) + k)) * (nl / (nl * (1.0 - k) + k));
}
fn fSchlick(c: f32, f0: vec3f) -> vec3f { return f0 + (vec3f(1.0) - f0) * pow(1.0 - c, 5.0); }
// Cook-Torrance (already multiplied by N.L).
fn brdf(N: vec3f, V: vec3f, L: vec3f, alb: vec3f, rough: f32, metal: f32) -> vec3f {
  let H = normalize(V + L);
  let f0 = mix(vec3f(0.04), alb, metal);
  let nl = max(dot(N, L), 0.0);
  let nv = max(dot(N, V), 0.0001);
  let fr = fSchlick(max(dot(V, H), 0.0), f0);
  let spec = dGGX(max(dot(N, H), 0.0), rough * rough) * gSmith(nv, nl, rough) * fr / (4.0 * nv * max(nl, 0.0001));
  return ((vec3f(1.0) - fr) * (1.0 - metal) * alb / PI + spec) * nl;
}

// Flat studs on top faces (1-stud grid), fading with distance so they never shimmer. Returns perturbed normal + mark.
fn stud(wp: vec3f, n: vec3f, dist: f32, studOn: f32) -> vec4f {
  let fade = (1.0 - smoothstep(25.0, 75.0, dist)) * studOn * select(0.0, 1.0, n.y > 0.95);
  let c = fract(wp.xz) - vec2f(0.5);
  let r = length(c) / 0.3;
  let dir = c / max(length(c), 0.0001);
  let tilt = smoothstep(0.88, 1.0, r) * select(0.0, 1.0, r < 1.0) * 1.6 * fade;
  let mark = select(0.0, 1.0, abs(c.x) < 0.075 && abs(c.y) < 0.075) * fade;
  return vec4f(normalize(n + vec3f(dir.x, 0.0, dir.y) * tilt), mark);
}

@fragment fn fs_main(i: VOut) -> @location(0) vec4f {
  let dist = length(F.camPos.xyz - i.wpos);
  let n0 = normalize(i.nrm);
  let wi = i32(i.params.w + 0.5);                       // bit 0: studs, higher bits: streamed texture layer + 1 (0 = none)
  let st = stud(i.wpos, n0, dist, select(0.0, 1.0, (wi & 1) != 0));
  let N = st.xyz;
  let V = normalize(F.camPos.xyz - i.wpos);
  let rough = clamp(i.params.x, 0.05, 1.0);
  let metal = i.params.y;
  let tl = (wi >> 1u) - 1;
  let texel = textureSample(meshTex, meshSamp, i.uv, max(tl, 0)).rgb;
  let alb = pow(i.color.rgb, vec3f(2.2)) * select(vec3f(1.0), texel, tl >= 0) * (1.0 - 0.15 * st.w);
  var col = brdf(N, V, F.sunDir.xyz, alb, rough, metal) * F.sunColor.rgb * shadow(i.wpos, n0);
  // Ambient: bright sky hemisphere from above, warm bounce from below, plus a rough-attenuated sky reflection.
  let f0 = mix(vec3f(0.04), alb, metal);
  let fa = fSchlick(max(dot(N, V), 0.0001), f0);
  let hemi = mix(GND_AMB, SKY_AMB, N.y * 0.5 + 0.5);
  col += (vec3f(1.0) - fa) * (1.0 - metal) * alb * hemi * 0.9;
  col += skyEnv(reflect(-V, N)) * fa * mix(1.0, 0.2, rough);
  col += alb * i.params.z;
  // Distance haze fades into the horizon band of the sky.
  let vd = normalize(i.wpos - F.camPos.xyz);
  let hz = skyEnv(normalize(vec3f(vd.x, 0.03, vd.z)));
  col = mix(col, hz, (1.0 - exp(-F.haze.x * dist)) * exp(-max(i.wpos.y, 0.0) * 0.01));
  return vec4f(col, i.color.a);
}

struct SkyOut { @builtin(position) pos: vec4f, @location(0) ndc: vec2f }
@vertex fn vs_sky(@builtin(vertex_index) i: u32) -> SkyOut {
  var p = array<vec2f, 3>(vec2f(-1.0, -1.0), vec2f(3.0, -1.0), vec2f(-1.0, 3.0));
  var o: SkyOut; o.pos = vec4f(p[i], 1.0, 1.0); o.ndc = p[i]; return o;
}
@fragment fn fs_sky(i: SkyOut) -> @location(0) vec4f {
  let d = normalize(F.camFwd.xyz + F.camRight.xyz * (i.ndc.x * F.proj.x * F.proj.y) + F.camUp.xyz * (i.ndc.y * F.proj.x));
  return vec4f(skyBg(d), 1.0);
}
`;

const SHADOW = /* wgsl */`
struct Inst { model: mat4x4f, color: vec4f, params: vec4f }
struct VP { m: mat4x4f }
@group(0) @binding(0) var<uniform> vp: VP;
@group(0) @binding(1) var<storage, read> inst: array<Inst>;
@vertex fn vs_shadow(@location(0) p: vec3f, @builtin(instance_index) ii: u32) -> @builtin(position) vec4f {
  return vp.m * inst[ii].model * vec4f(p, 1.0);
}
`;

const POST = /* wgsl */`
@group(0) @binding(0) var samp: sampler;
@group(0) @binding(1) var tex: texture_2d<f32>;
@group(0) @binding(2) var tex2: texture_2d<f32>;
struct PO { @builtin(position) pos: vec4f, @location(0) uv: vec2f }
@vertex fn vs(@builtin(vertex_index) i: u32) -> PO {
  var p = array<vec2f, 3>(vec2f(-1.0, -1.0), vec2f(3.0, -1.0), vec2f(-1.0, 3.0));
  var o: PO; o.pos = vec4f(p[i], 0.0, 1.0); o.uv = vec2f(p[i].x * 0.5 + 0.5, 0.5 - p[i].y * 0.5); return o;
}
fn tap(uv: vec2f) -> vec3f { return textureSampleLevel(tex, samp, uv, 0.0).rgb; }
fn box4(uv: vec2f) -> vec3f {
  let ts = 1.0 / vec2f(textureDimensions(tex));
  return 0.25 * (tap(uv + ts * vec2f(-1.0, -1.0)) + tap(uv + ts * vec2f(1.0, -1.0)) + tap(uv + ts * vec2f(-1.0, 1.0)) + tap(uv + ts * vec2f(1.0, 1.0)));
}
@fragment fn fs_pre(i: PO) -> @location(0) vec4f {   // only energy above 1.0 blooms (sun, hot highlights)
  let c = box4(i.uv); let l = max(c.r, max(c.g, c.b));
  return vec4f(min(c * (max(l - 1.0, 0.0) / max(l, 0.0001)), vec3f(50.0)), 1.0);
}
@fragment fn fs_down(i: PO) -> @location(0) vec4f { return vec4f(box4(i.uv), 1.0); }
@fragment fn fs_up(i: PO) -> @location(0) vec4f { return vec4f(box4(i.uv), 1.0); } // additive blend

fn aces(x: vec3f) -> vec3f {
  return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), vec3f(0.0), vec3f(1.0));
}
fn srgb(c: vec3f) -> vec3f { return select(1.055 * pow(c, vec3f(1.0 / 2.4)) - 0.055, c * 12.92, c <= vec3f(0.0031308)); }
@fragment fn fs_comp(i: PO) -> @location(0) vec4f {
  let hdr = (textureSampleLevel(tex, samp, i.uv, 0.0).rgb + textureSampleLevel(tex2, samp, i.uv, 0.0).rgb * 0.3) * 1.25;
  var c = aces(hdr);
  let l = dot(c, vec3f(0.2126, 0.7152, 0.0722));
  c = mix(vec3f(l), c, 1.12) * vec3f(1.03, 1.0, 0.96);       // saturated, slightly warm
  return vec4f(srgb(c), 1.0);
}
`;

// Crimson web renderer, FigureBlox-style look. WebGPU, HDR, 4x MSAA, PBR, 3 sun cascades with PCF,
// procedural or six-face skybox, distance haze into the sky's horizon band, soft bloom, filmic tone map.




const SHAPE_CAP = { cube: 4096, sphere: 1024, cylinder: 1024, wedge: 1024, cone: 1024 }, GLASS_CAP = { cube: 2048, sphere: 256, cylinder: 256, wedge: 256, cone: 256 }, MESH_CAP = 2048, VERT_ARENA = 524288, IDX_ARENA = 2097152, TEX_SIZE = 256, TEX_LAYERS = 64, CASCADES = 3, SHADOW_SIZE = 2048, BLOOM = 5, REACH = 200, MSAA = 4, SKY_SIZE = 1024;

class Renderer {

    this._setSkyTexture(d.createTexture({ size: [1, 1, 6], format: 'rgba8unorm-srgb', usage: T.TEXTURE_BINDING | T.COPY_DST }));  // placeholder until a skybox is loaded
  }

  _setSkyTexture(tex) {

    const sky = tex.createView({ dimension: '2d-array' }), fr = { binding: 0, resource: { buffer: this.frame } };
    this.sceneBG = d.createBindGroup({ layout: this.scenePipe.getBindGroupLayout(0), entries: [fr, { binding: 1, resource: { buffer: this.instBuf } },
      { binding: 2, resource: this.shadowArr }, { binding: 3, resource: this.cmp }, { binding: 4, resource: sky }, { binding: 5, resource: this.skySamp }, { binding: 6, resource: this.meshTexView }, { binding: 7, resource: this.meshSamp }] });
    this.glassBG = d.createBindGroup({ layout: this.glassPipe.getBindGroupLayout(0), entries: [fr, { binding: 1, resource: { buffer: this.instBuf } },
      { binding: 2, resource: this.shadowArr }, { binding: 3, resource: this.cmp }, { binding: 4, resource: sky }, { binding: 5, resource: this.skySamp }, { binding: 6, resource: this.meshTexView }, { binding: 7, resource: this.meshSamp }] });
    this.skyBG = d.createBindGroup({ layout: this.skyPipe.getBindGroupLayout(0), entries: [fr, { binding: 4, resource: sky }, { binding: 5, resource: this.skySamp }] });

  async setSkyboxFromBlob(blob) {

  }

  // Stable (rotation-invariant, texel-snapped) box around one frustum slice.
  _cascade(cam, c, near, far, toSun) {
